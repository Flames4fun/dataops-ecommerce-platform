version: 2

models:
  - name: stg_categories
    description: >
      Staging layer for product categories.
      Grain: 1 row per category_name_pt.

      Transformations: cleaned category names (trimmed, lowercased),
      generated surrogate key.
      category_name_en is expected to be present for all rows.

    config:
      tags: ['staging', 'categories']

    columns:
      - name: category_key
        description: Surrogate key for category
        data_tests:
          - unique:
              where: "category_key is not null"
          - not_null:
              where: "category_name_pt is not null"

      - name: category_name_pt
        description: Category name in Portuguese
        data_tests:
          - unique
          - not_null

      - name: category_name_en
        description: Category name in English (cleaned, lowercase, trimmed)
        data_tests:
          - not_null
