version: 2

models:
  - name: stg_sellers
    description: >
      Staging layer for sellers.
      Grain: 1 row per seller_id.

      Transformations: cleaned location fields, generated surrogate key,
      added validation flag.

    config:
      tags: ['staging', 'sellers']

    columns:
      - name: seller_key
        description: Surrogate key for seller
        tests:
          - unique:
              where: "seller_key is not null"
          - not_null:
              where: "seller_id is not null"

      - name: seller_id
        description: Seller identifier
        tests:
          - unique
          - not_null

      - name: zip_code_prefix
        description: First 5 digits of seller zip code
        tests:
          - not_null

      - name: city
        description: Seller city name (Portuguese)
        tests:
          - not_null

      - name: state
        tests:
          - not_null
          - accepted_values:
              values: ['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO']

      - name: zip_code_clean
        description: Cleaned zip code (trimmed, nullif empty)

      - name: city_clean
        description: Cleaned city (trimmed, uppercased, nullif empty)

      - name: state_clean
        tests:
          - accepted_values:
              values: ['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO']
              where: "state_clean is not null"

      - name: is_missing_location
        description: Flag for missing/empty location fields after cleaning
        tests:
          - accepted_values:
              values: [true, false]
          - not_null
