version: 2

models:
  - name: mart_kpis_daily
    description: >
      Daily KPI mart for business monitoring.
      Grain: 1 row per kpi_date (order purchase date).

      KPI formulas:
      - gmv = sum(item_total) for non-canceled orders
      - aov = gmv / orders_for_aov
      - cancel_rate = canceled_orders / total_orders
      - late_delivery_rate = late_delivered_orders / delivered_orders

    config:
      tags: ['marts', 'kpi', 'daily']
    meta:
      owner:
        name: Analytics Engineering Team
        email: luisfuentes.code@gmail.com
      sla:
        timezone: 'America/Bogota'
        max_data_lag_hours: 24
        expected_ready_by_local_time: '07:00'
      criticality: high

    data_tests:
      - dbt_utils.expression_is_true:
          expression: "canceled_orders + non_canceled_orders = total_orders"
      - dbt_utils.expression_is_true:
          expression: "late_delivered_orders <= delivered_orders"
      - dbt_utils.expression_is_true:
          expression: "orders_for_aov <= non_canceled_orders"

    columns:
      - name: kpi_date
        description: KPI day (derived from order_purchase_date)
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_dates')
              field: date_day
              config:
                severity: error

      - name: total_orders
        description: Total orders created on kpi_date
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 1"

      - name: canceled_orders
        description: Count of canceled orders on kpi_date
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: non_canceled_orders
        description: Count of non-canceled orders on kpi_date
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: delivered_orders
        description: Count of delivered orders on kpi_date
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: late_delivered_orders
        description: Count of delivered orders that arrived late on kpi_date
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: orders_for_aov
        description: Distinct non-canceled orders with items (AOV denominator)
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: gmv
        description: Gross merchandise value from fact_order_items for non-canceled orders
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: aov
        description: Average order value for non-canceled orders with items
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                where: "aov is not null"

      - name: cancel_rate
        description: canceled_orders / total_orders
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"

      - name: late_delivery_rate
        description: late_delivered_orders / delivered_orders (nullable when delivered_orders = 0)
        data_tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
              config:
                where: "late_delivery_rate is not null"
