version: 2

models:
  - name: fact_order_items
    description: >
      Order items fact table.
      Grain: 1 row per order_item_key.

      Built from int_order_items_enriched without redoing product/category/seller
      joins. Adds order_purchase_date from int_orders_enriched through a safe
      many-to-one join on order_id.

    config:
      tags: ['marts', 'fact', 'order_items']

    columns:
      - name: order_item_key
        description: Surrogate key for the order item (fact grain)
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: FK to fact_orders.order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('fact_orders')
              field: order_id
              config:
                severity: warn

      - name: product_id
        description: FK to dim_products.product_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
              config:
                severity: warn

      - name: seller_id
        description: FK to dim_sellers.seller_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: seller_id
              config:
                severity: warn

      - name: order_purchase_date
        description: FK to dim_dates.date_day from the parent order purchase date
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_dates')
              field: date_day
              config:
                severity: warn

      - name: price
        description: Item price amount in BRL
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: freight_value
        description: Freight amount in BRL
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: item_total
        description: Item total amount (price + freight)
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: is_zero_price
        description: True when item price is zero or negative
        data_tests:
          - accepted_values:
              values: [true, false]
          - not_null

      - name: is_negative_freight
        description: True when freight value is negative
        data_tests:
          - accepted_values:
              values: [true, false]
          - not_null
