version: 2

models:
  - name: fact_orders
    description: >
      Main orders fact table.
      Grain: 1 row per order_id.

      Built from int_orders_enriched without additional joins to preserve
      order grain and avoid row multiplication.

    config:
      tags: ['marts', 'fact', 'orders']
    meta:
      owner:
        name: Data Platform Team
        email: luisfuentes.code@gmail.com
      sla:
        timezone: 'America/Bogota'
        max_data_lag_hours: 24
        expected_ready_by_local_time: '07:00'
      criticality: high

    columns:
      - name: order_id
        description: Order identifier (fact grain)
        data_tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: FK to dim_customers.customer_unique_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_unique_id
              config:
                severity: warn

      - name: order_purchase_date
        description: FK to dim_dates.date_day based on purchased_at
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_dates')
              field: date_day
              config:
                severity: warn

      - name: order_approved_date
        description: Optional FK to dim_dates.date_day based on approved_at
        data_tests:
          - relationships:
              to: ref('dim_dates')
              field: date_day
              config:
                severity: warn

      - name: order_delivered_carrier_date
        description: Optional FK to dim_dates.date_day based on delivered_carrier_at
        data_tests:
          - relationships:
              to: ref('dim_dates')
              field: date_day
              config:
                severity: warn

      - name: order_delivered_customer_date
        description: Optional FK to dim_dates.date_day based on delivered_customer_at
        data_tests:
          - relationships:
              to: ref('dim_dates')
              field: date_day
              config:
                severity: warn

      - name: order_estimated_delivery_date
        description: Optional FK to dim_dates.date_day based on estimated_delivery_at
        data_tests:
          - relationships:
              to: ref('dim_dates')
              field: date_day
              config:
                severity: warn

      - name: is_late_delivery
        description: True when delivered after estimated delivery date
        data_tests:
          - accepted_values:
              values: [true, false]
          - not_null

      - name: is_canceled
        description: True when order_status is canceled
        data_tests:
          - accepted_values:
              values: [true, false]
          - not_null

      - name: is_delivered
        description: True when order_status is delivered
        data_tests:
          - accepted_values:
              values: [true, false]
          - not_null
