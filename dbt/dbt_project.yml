name: 'dataops_ecommerce'
version: '1.0.0'
config-version: 2

profile: 'dataops_ecommerce'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

require-dbt-version: ">=1.7.0"

quoting:
  database: false
  schema: false
  identifier: false

vars:
  start_date: '2016-01-01'
  end_date: '2018-12-31'
  gmv_calculation: 'sum(payment_value)'
  aov_calculation: 'avg(payment_value)'

dispatch:
  - macro_namespace: dbt
    search_order: ['dataops_ecommerce', 'dbt']

models:
  dataops_ecommerce:
    +materialized: view

    +persist_docs:
      relation: true
      columns: true

    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]

    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]

    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]

      dimensions:
        +materialized: table
        +tags: ["dimension"]

      facts:
        +materialized: table
        +tags: ["fact"]

seeds:
  dataops_ecommerce:
    +schema: seeds
    +quote_columns: false

snapshots:
  dataops_ecommerce:
    +target_schema: snapshots
    +tags: ["snapshots"]